<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game-học Vietwise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@500;700&display=swap">
<style>
:root{--blue:#1530D0;--cam:#F26419;--vang:#F7C52A;--bg:#F9FAF7;--card:#fff;--ink:#1b1b2b;--mut:#5b5b70;--line:#e6e2c8;--soft:#f4f1da;--xanh:#4CA51E}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#8a95ff;--bg:#14141f;--card:#1e1e2d;--ink:#f2f1e6;--mut:#b0b0c4;--line:#35354a;--soft:#272738}}
:root[data-theme="dark"]{--blue:#8a95ff;--bg:#14141f;--card:#1e1e2d;--ink:#f2f1e6;--mut:#b0b0c4;--line:#35354a;--soft:#272738}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.6 Nunito,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.q{font-family:Quicksand,Nunito,sans-serif;font-weight:700}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:#fff;color:#444;font-size:14px;border-bottom:3px solid var(--cam)}
.brand.bot{border-bottom:0;border-top:3px solid var(--cam);margin-top:auto;justify-content:center;text-align:center;font:700 15px/1.5 Quicksand,sans-serif;color:#1530D0;padding:12px 16px}
.brand a{display:inline-flex;align-items:center}.brand img{height:var(--lh,44px);width:auto;display:block}
.brand .t{font-family:Quicksand,sans-serif;font-weight:700;color:#1530D0}@media(max-width:560px){.brand{--lh:30px;gap:4px 8px;padding:6px 12px;font-size:12px}.brand .t{font-size:12.5px}.brand .t:first-child{flex:0 0 100%}.brand.bot{font-size:13px}}
main{width:100%;max-width:980px;margin:0 auto;padding:18px 16px 28px;flex:1}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pill{background:var(--soft);border-radius:999px;padding:3px 14px;font:700 14px Quicksand;color:var(--mut)}
.bar{display:flex;gap:6px;margin:8px 0 16px}.bar i{flex:1;height:8px;border-radius:4px;background:var(--line)}.bar i.on{background:var(--cam)}.bar i.done{background:var(--xanh)}
h1{font-size:30px;color:var(--blue);margin:0 0 4px;line-height:1.2}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.panel h2{margin:0 0 10px;font-size:24px;color:var(--cam)}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:48px;height:48px;border-radius:50%;background:var(--vang);color:#222;display:grid;place-items:center;font:700 22px Quicksand}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tags span{background:var(--soft);border-radius:10px;padding:4px 12px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px}
.cd{min-height:130px;border-radius:16px;border:3px solid var(--blue);background:var(--blue);color:#fff;font:700 40px Quicksand;display:grid;place-items:center;cursor:pointer;padding:12px;text-align:center;transition:transform .2s}
.cd:hover{transform:translateY(-3px)}
.cd.open{background:var(--card);color:var(--ink);font:400 18px/1.5 Nunito;display:block;text-align:left;border-color:var(--cam);cursor:default}
.cd.open b{display:block;color:var(--cam);font:700 26px Quicksand}
.cd.open:hover{transform:none}
ul{padding-left:22px;margin:6px 0}li{margin:4px 0}
.dash{border:3px dashed var(--vang);border-radius:16px;padding:14px;margin-top:12px}
.g{background:#fff7d6;color:#3a3200;border-left:5px solid var(--vang);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:16px;display:none}
.gv .g{display:block}.g strong{font-weight:700}
.map{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px}
.map div{background:var(--soft);border-radius:10px;padding:8px 12px}
@media(max-width:640px){.map{grid-template-columns:1fr}h1{font-size:24px}}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{font:700 17px Quicksand;border-radius:999px;padding:10px 22px;cursor:pointer;border:2px solid var(--cam);background:var(--cam);color:#fff}
button.s{background:transparent;color:var(--ink);border-color:var(--blue)}
button:disabled{opacity:.4;cursor:default}
.tm{font:700 20px Quicksand;color:var(--mut);min-width:64px;text-align:center}
.ill{background:#fff;border-radius:14px;border:1px solid var(--line);margin:10px 0;overflow:hidden}.ill svg{width:100%;height:auto;max-height:260px;display:block}.mascot{width:96px;height:auto;float:right;margin:0 0 8px 12px}
.err{padding:24px;text-align:center;color:#DF0000;font-weight:700}
.say{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}.say button{min-height:44px;padding:8px 16px;border:2px solid #1530D0;background:#fff;border-radius:999px;font:700 16px Quicksand,sans-serif;color:#1530D0;cursor:pointer}.say small{flex:0 0 100%;color:#7a5a00}
.lvt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.lvb{display:flex;flex-direction:column;align-items:flex-start;border-radius:14px;padding:10px 14px;text-align:left;background:var(--card);color:var(--ink);border:3px solid var(--k)}.lvb b{font:700 18px Quicksand;color:var(--k)}.lvb span{font:400 15px/1.3 Nunito}
.lvb[aria-pressed=true]{background:var(--k);color:#fff}.lvb[aria-pressed=true] b{color:#fff}
.lv1{--k:#4CA51E}.lv2{--k:var(--blue)}.lv3{--k:#F26419}.lv4{--k:#B8860B}
.lvc{border:3px solid var(--k);border-radius:16px;padding:16px;margin-top:6px}.lvc>b{display:block;color:var(--k);font:700 20px Quicksand}.lvc button.s{margin-top:8px}
.lvg{background:var(--soft);border-radius:10px;padding:6px 12px;margin-top:10px}
.pill.gvo{display:none}.gv .pill.gvo{display:inline-block}
#lock{position:fixed;inset:0;background:#fff;color:#222;z-index:99;display:none;place-items:center;text-align:center;padding:24px;font-size:20px}
</style></head><body>
<div id="lock"><div><b>Trang này đã bị gỡ hoặc sửa phần ghi nguồn Vietwise.</b><br>Thầy Cô vui lòng dùng bản gốc từ Skill Game-học tại <a href="https://vietwise.edu.vn" target="_blank" rel="noopener">Vietwise.edu.vn</a>.</div></div>

<script type="application/json" id="game">{"phien_ban": "1.0", "loai": "sach-la-thay", "tieu_de": "Trò đùa sau giờ ra chơi", "mon": "Ngữ văn", "lop": "6", "nhom_lop": "C", "nhom_mon": "ngu-van", "bai": "Bài học đường đời đầu tiên: nghĩ trước khi đùa, sống có trách nhiệm với người khác", "thoi_luong_phut": 20, "sach": {"ten": "Dế Mèn phiêu lưu ký", "tac_gia": "Tô Hoài", "phan_doc": "Chương 1", "nguon_noi_dung": "claude-biet-ro"}, "kien_thuc": ["Thói hung hăng, xốc nổi có thể gây hậu quả cho người khác và cho chính mình", "Biết hối hận và sửa mình là bước đầu của trưởng thành", "Lời khuyên của Dế Choắt: có óc phải biết nghĩ"], "pham_chat": "trách nhiệm", "chau_ngoc": "thich-nghi", "ba_nhip": {"biet_on": "Em biết ơn một người bạn từng nhắc em dừng lại đúng lúc."}, "chia_khoa": [{"cau_hoi": "Khi mới lớn, Dế Mèn tự thấy mình thế nào và hay cư xử ra sao với hàng xóm?", "trang": "Chương 1, đoạn đầu", "gv_goi_y": "Khoẻ, đẹp, càng mẫm bóng, vuốt nhọn; tự cho là giỏi, hay cà khịa với bà con trong xóm."}, {"cau_hoi": "Dế Choắt nhờ Dế Mèn việc gì, và Dế Mèn trả lời thế nào?", "trang": "Chương 1, đoạn sang nhà Dế Choắt", "gv_goi_y": "Nhờ đào ngách thông sang nhà Mèn để có lối chạy khi gặp nguy; Mèn từ chối và nói lời coi thường."}, {"cau_hoi": "Dế Mèn đã trêu chị Cốc bằng cách nào? Ai phải chịu hậu quả?", "trang": "Chương 1, đoạn trêu chị Cốc", "gv_goi_y": "Hát trêu rồi chui vào hang; chị Cốc tưởng Dế Choắt nên mổ Dế Choắt."}, {"cau_hoi": "Trước khi mất, Dế Choắt khuyên Dế Mèn điều gì?", "trang": "Chương 1, đoạn cuối", "gv_goi_y": "Ở đời mà có thói hung hăng bậy bạ, có óc mà không biết nghĩ, sớm muộn rồi cũng mang vạ vào mình."}, {"cau_hoi": "Sau đó Dế Mèn làm gì và cảm thấy thế nào?", "trang": "Chương 1, đoạn cuối", "gv_goi_y": "Chôn Dế Choắt, đắp mộ, đứng lặng hồi lâu, ân hận; nhận ra bài học đường đời đầu tiên."}], "nhan_vat": [{"ten": "Minh"}], "loi_ke": "Minh khoẻ nhất lớp 6A và rất thích đùa. Giờ ra chơi, Minh rủ cả nhóm giấu cặp của một anh lớp 8 nổi tiếng nóng tính, \"để xem anh ấy cuống lên thế nào\". Tuấn, bạn nhỏ người nhất nhóm, đang ngồi ngay cạnh chiếc cặp. Chuông sắp reo. Em đang ở trong nhóm.", "du_kien": ["Minh khoẻ, thích đùa", "Anh lớp 8 nóng tính", "Tuấn ngồi cạnh chiếc cặp", "Chuông sắp reo"], "lua_chon": [{"ma": "A", "noi_dung": "Đi theo cho vui, chỉ là trò đùa thôi", "gv_kien_thuc": "Giống Dế Mèn trêu chị Cốc: người gần nhất (Tuấn) có thể phải chịu hậu quả."}, {"ma": "B", "noi_dung": "Can Minh và nói rõ vì sao trò này có thể làm hại Tuấn", "gv_cai_gia": "Có thể bị nhóm chê là nhát."}, {"ma": "C", "noi_dung": "Không tham gia, lặng lẽ đi chỗ khác", "gv_cai_gia": "An toàn cho mình, nhưng Tuấn vẫn có thể gặp chuyện."}], "cach_chon": "Giơ thẻ màu A, B hoặc C", "cau_hoi_goi_mo": ["Chi tiết nào trong Chương 1 giúp em quyết định? Ở đoạn nào?", "Dế Choắt giống ai trong câu chuyện của Minh?"], "cau_mau_phan_bien": ["Dế Mèn cũng nghĩ đó chỉ là trò đùa. Vậy khác gì?", "Nếu chọn C, Tuấn có an toàn không?", "Can bạn thế nào để Minh nghe mà không mất mặt?"], "viet_tiep": "Nếu được viết lại đoạn trêu chị Cốc, em sẽ để Dế Mèn làm gì khác? Câu chuyện của Minh sẽ đổi thế nào?", "so_do_chot": [{"kien_thuc": "Dế Mèn trêu chị Cốc, Dế Choắt chịu hậu quả", "dung_vao": "Trò đùa của Minh có thể làm Tuấn bị hại"}, {"kien_thuc": "Lời khuyên của Dế Choắt: có óc phải biết nghĩ", "dung_vao": "Nghĩ hậu quả trước khi đùa"}, {"kien_thuc": "Dế Mèn hối hận và tự rút bài học", "dung_vao": "Sai rồi thì nhận và sửa, không đổ lỗi"}], "loi_chot": "Một người bạn có trách nhiệm sẽ nghĩ gì trước khi bày một trò đùa?", "du_an_that": "Viết một tấm thiệp ngắn cảm ơn một người từng nhắc em dừng lại đúng lúc, và trao tận tay trong tuần này.", "gv_ghi_chu": "Đối chiếu câu chữ và vị trí chi tiết với bản sách lớp đang dùng. Không chấm phần Chìa khoá sách: em nào chưa nhớ thì cả lớp mở sách đọc lại đoạn đó.", "giong": {"1220458933": "data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjYwLjE2LjEwMAAAAAAAAAAAAAAA//OEwAAAAAAAAAAAAEluZm8AAAAPAAADvgABDjAAAwYJCw0QEhYYGh
