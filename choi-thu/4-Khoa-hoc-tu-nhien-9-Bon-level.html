<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game-học Vietwise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@500;700&display=swap">
<style>
:root{--blue:#1530D0;--cam:#F26419;--vang:#F7C52A;--bg:#F9FAF7;--card:#fff;--ink:#1b1b2b;--mut:#5b5b70;--line:#e6e2c8;--soft:#f4f1da;--xanh:#4CA51E}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#8a95ff;--bg:#14141f;--card:#1e1e2d;--ink:#f2f1e6;--mut:#b0b0c4;--line:#35354a;--soft:#272738}}
:root[data-theme="dark"]{--blue:#8a95ff;--bg:#14141f;--card:#1e1e2d;--ink:#f2f1e6;--mut:#b0b0c4;--line:#35354a;--soft:#272738}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.6 Nunito,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.q{font-family:Quicksand,Nunito,sans-serif;font-weight:700}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:#fff;color:#444;font-size:14px;border-bottom:3px solid var(--cam)}
.brand.bot{border-bottom:0;border-top:3px solid var(--cam);margin-top:auto;justify-content:center;text-align:center;font:700 15px/1.5 Quicksand,sans-serif;color:#1530D0;padding:12px 16px}
.brand a{display:inline-flex;align-items:center}.brand img{height:var(--lh,44px);width:auto;display:block}
.brand .t{font-family:Quicksand,sans-serif;font-weight:700;color:#1530D0}@media(max-width:560px){.brand{--lh:30px;gap:4px 8px;padding:6px 12px;font-size:12px}.brand .t{font-size:12.5px}.brand .t:first-child{flex:0 0 100%}.brand.bot{font-size:13px}}
main{width:100%;max-width:980px;margin:0 auto;padding:18px 16px 28px;flex:1}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pill{background:var(--soft);border-radius:999px;padding:3px 14px;font:700 14px Quicksand;color:var(--mut)}
.bar{display:flex;gap:6px;margin:8px 0 16px}.bar i{flex:1;height:8px;border-radius:4px;background:var(--line)}.bar i.on{background:var(--cam)}.bar i.done{background:var(--xanh)}
h1{font-size:30px;color:var(--blue);margin:0 0 4px;line-height:1.2}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.panel h2{margin:0 0 10px;font-size:24px;color:var(--cam)}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:48px;height:48px;border-radius:50%;background:var(--vang);color:#222;display:grid;place-items:center;font:700 22px Quicksand}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tags span{background:var(--soft);border-radius:10px;padding:4px 12px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px}
.cd{min-height:130px;border-radius:16px;border:3px solid var(--blue);background:var(--blue);color:#fff;font:700 40px Quicksand;display:grid;place-items:center;cursor:pointer;padding:12px;text-align:center;transition:transform .2s}
.cd:hover{transform:translateY(-3px)}
.cd.open{background:var(--card);color:var(--ink);font:400 18px/1.5 Nunito;display:block;text-align:left;border-color:var(--cam);cursor:default}
.cd.open b{display:block;color:var(--cam);font:700 26px Quicksand}
.cd.open:hover{transform:none}
ul{padding-left:22px;margin:6px 0}li{margin:4px 0}
.dash{border:3px dashed var(--vang);border-radius:16px;padding:14px;margin-top:12px}
.g{background:#fff7d6;color:#3a3200;border-left:5px solid var(--vang);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:16px;display:none}
.gv .g{display:block}.g strong{font-weight:700}
.map{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px}
.map div{background:var(--soft);border-radius:10px;padding:8px 12px}
@media(max-width:640px){.map{grid-template-columns:1fr}h1{font-size:24px}}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{font:700 17px Quicksand;border-radius:999px;padding:10px 22px;cursor:pointer;border:2px solid var(--cam);background:var(--cam);color:#fff}
button.s{background:transparent;color:var(--ink);border-color:var(--blue)}
button:disabled{opacity:.4;cursor:default}
.tm{font:700 20px Quicksand;color:var(--mut);min-width:64px;text-align:center}
.ill{background:#fff;border-radius:14px;border:1px solid var(--line);margin:10px 0;overflow:hidden}.ill svg{width:100%;height:auto;max-height:260px;display:block}.mascot{width:96px;height:auto;float:right;margin:0 0 8px 12px}
.err{padding:24px;text-align:center;color:#DF0000;font-weight:700}
.say{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}.say button{min-height:44px;padding:8px 16px;border:2px solid #1530D0;background:#fff;border-radius:999px;font:700 16px Quicksand,sans-serif;color:#1530D0;cursor:pointer}.say small{flex:0 0 100%;color:#7a5a00}
.lvt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.lvb{display:flex;flex-direction:column;align-items:flex-start;border-radius:14px;padding:10px 14px;text-align:left;background:var(--card);color:var(--ink);border:3px solid var(--k)}.lvb b{font:700 18px Quicksand;color:var(--k)}.lvb span{font:400 15px/1.3 Nunito}
.lvb[aria-pressed=true]{background:var(--k);color:#fff}.lvb[aria-pressed=true] b{color:#fff}
.lv1{--k:#4CA51E}.lv2{--k:var(--blue)}.lv3{--k:#F26419}.lv4{--k:#B8860B}
.lvc{border:3px solid var(--k);border-radius:16px;padding:16px;margin-top:6px}.lvc>b{display:block;color:var(--k);font:700 20px Quicksand}.lvc button.s{margin-top:8px}
.lvg{background:var(--soft);border-radius:10px;padding:6px 12px;margin-top:10px}
.pill.gvo{display:none}.gv .pill.gvo{display:inline-block}
#lock{position:fixed;inset:0;background:#fff;color:#222;z-index:99;display:none;place-items:center;text-align:center;padding:24px;font-size:20px}
</style></head><body>
<div id="lock"><div><b>Trang này đã bị gỡ hoặc sửa phần ghi nguồn Vietwise.</b><br>Thầy Cô vui lòng dùng bản gốc từ Skill Game-học tại <a href="https://vietwise.edu.vn" target="_blank" rel="noopener">Vietwise.edu.vn</a>.</div></div>
<div id="brand-top" class="brand"></div>
<main id="app"></main>
<div id="brand-bot" class="brand bot"></div>
<script type="application/json" id="game">{"phien_ban": "1.0", "loai": "on-bai", "tieu_de": "Bữa tối trước đêm ôn thi", "mon": "Khoa học tự nhiên", "lop": "9", "nhom_lop": "D", "nhom_mon": "khoa-hoc", "bai": "Lipid, carbohydrate (glucose, saccharose, tinh bột và cellulose), protein", "thoi_luong_phut": 25, "kien_thuc": ["Chất béo (lipid) cho nhiều năng lượng nhất trên mỗi gam, giúp cơ thể hấp thụ vitamin A, D, E, K", "Glucose (C6H12O6) vào máu nhanh; saccharose (C12H22O11, đường mía) thủy phân ra glucose và fructose", "Tinh bột và cellulose đều tạo từ nhiều đơn vị glucose, (C6H10O5)n; người tiêu hóa được tinh bột, không tiêu hóa được cellulose", "Protein tạo từ các amino acid, là chất xây dựng cơ thể; đông tụ khi đun nóng"], "pham_chat": "trách nhiệm với chính mình", "nhan_vat": [{"ten": "Minh"}], "loi_ke": "Còn ba tuần nữa là thi vào lớp 10. Tối nào Minh cũng học đến khuya, bỏ bữa tối, rồi mười giờ đêm mua một cốc trà sữa thật ngọt cho tỉnh. Được nửa tiếng thì Minh lại buồn ngủ, đói cồn cào và không nhớ nổi bài vừa đọc. Tối nay bà để sẵn trên bàn: cơm, trứng, rau luộc, chai dầu lạc, bên cạnh là cốc trà sữa Minh vừa mua. Không ai bắt Minh phải ăn gì. Vậy trong những món ấy, chất nào giúp một đêm học đi được đường dài?", "du_kien": ["Học 3 tiếng buổi tối", "Cơm (tinh bột)", "Trứng (protein)", "Rau luộc (cellulose)", "Dầu lạc (chất béo)", "Trà sữa ngọt (saccharose)"], "lua_chon": [{"ma": "A", "noi_dung": "Uống trà sữa, vì đường vào máu nhanh nhất nên tỉnh nhanh nhất", "gv_kien_thuc": "Đúng là glucose vào máu nhanh, saccharose cũng thủy phân nhanh ra glucose và fructose. Nhưng năng lượng đến nhanh thì cũng hết nhanh; bữa chỉ có đường thiếu protein và chất xơ. Đây là hiểu lầm \"càng ngọt càng tỉnh lâu\"."}, {"ma": "B", "noi_dung": "Ăn một bữa có đủ cơm, trứng, rau và chút dầu, trà sữa để dành hoặc bỏ", "gv_kien_thuc": "Tinh bột phải thủy phân dần thành glucose nên năng lượng đến từ từ; protein trong trứng là chất xây dựng cơ thể; cellulose trong rau người không tiêu hóa được nhưng là chất xơ giúp tiêu hóa; chất béo giúp hấp thụ vitamin A, D, E, K."}, {"ma": "C", "noi_dung": "Chỉ ăn rau và trứng, bỏ cơm và dầu vì tinh bột với chất béo làm béo", "gv_kien_thuc": "Hiểu lầm \"chất béo, tinh bột là xấu\". Bỏ hẳn tinh bột và chất béo là bỏ hai nguồn năng lượng chính; chất béo cho khoảng 9 kcal mỗi gam, tinh bột và protein khoảng 4 kcal mỗi gam. Vấn đề là lượng và cách ăn, không phải tên chất."}], "cach_chon": "Giơ thẻ màu A, B hoặc C", "cau_hoi_goi_mo": ["Món nào trên bàn có nhiều tinh bột, nhiều protein, nhiều chất béo, nhiều cellulose?", "Vì sao uống nước ngọt thấy tỉnh nhanh mà lại mau đói?", "Tinh bột và cellulose đều tạo từ glucose. Vậy vì sao cơm nuôi được người, còn cọng rau thì không?"], "cau_mau_phan_bien": ["Nếu Minh học buổi sáng chứ không học buổi đêm, bữa ăn nên đổi thế nào?", "Bạn dựa vào kiến thức nào trong bài để nói một chất là \"tốt\" hay \"không tốt\"?", "Có khi nào chính chất ấy lại có ích ở lượng này và có hại ở lượng khác không?"], "so_do_chot": [{"kien_thuc": "Glucose, saccharose: vào máu nhanh", "dung_vao": "Trà sữa làm tỉnh nhanh rồi mau hết (lựa chọn A)"}, {"kien_thuc": "Tinh bột thủy phân dần thành glucose", "dung_vao": "Cơm cho năng lượng đều cả buổi học (lựa chọn B)"}, {"kien_thuc": "Cellulose: người không tiêu hóa được, là chất xơ", "dung_vao": "Rau luộc vẫn cần trong bữa ăn"}, {"kien_thuc": "Protein, chất béo", "dung_vao": "Trứng xây dựng cơ thể, dầu giúp hấp thụ vitamin (bác bỏ lựa chọn C)"}], "level": [{"so": 1, "ten": "Làm quen", "nhiem_vu": "Ghép mỗi món trên bàn của Minh với chất có nhiều nhất trong món đó: cơm, trứng, rau luộc, dầu lạc, trà sữa.", "goi_y": ["Bốn nhóm: tinh bột, protein, cellulose (chất xơ), chất béo", "Trà sữa ngọt nhờ đường mía, tức saccharose"], "gv_danh_cho": "Học sinh cần thêm thời gian, cần gợi ý từng bước. Gợi ý hiện sẵn.", "gv_dap_an": "Cơm: tinh bột. Trứng: protein (lòng đỏ có cả chất béo). Rau luộc: cellulose. Dầu lạc: chất béo. Trà sữa: saccharose (và chất béo từ sữa, kem)."}, {"so": 2, "ten": "Vững bước", "nhiem_vu": "Giải thích cho Minh vì sao cốc trà sữa làm Minh tỉnh rất nhanh nhưng chỉ được một lúc, còn bát cơm thì no lâu hơn.", "goi_y": ["Saccharose thủy phân thành những chất nào?", "Tinh bột phải qua bao nhiêu bước mới thành glucose?"], "gv_danh_cho": "Học sinh nắm được bài, cần gợi ý khi hỏi.", "gv_dap_an": "Saccharose thủy phân nhanh ra glucose và fructose, glucose vào máu ngay nên tỉnh nhanh và cũng hết nhanh. Tinh bột là chuỗi dài nhiều đơn vị glucose, phải thủy phân dần nên glucose đến từ từ."}, {"so": 3, "ten": "Vận dụng", "nhiem_vu": "Tinh bột và cellulose đều tạo từ các đơn vị glucose. Vì sao cơm nuôi được người còn cọng rau thì cơ thể người không lấy được năng lượng? Nếu vậy thì ăn rau để làm gì?", "goi_y": ["Cơ thể người có enzyme thủy phân được tinh bột, còn cellulose thì sao?"], "gv_danh_cho": "Học sinh vững bài, thích lập luận. Gợi ý chỉ hiện khi xin.", "gv_dap_an": "Hai chất cùng công thức (C6H10O5)n nhưng các đơn vị glucose liên kết khác nhau; người có enzyme thủy phân tinh bột, không có enzyme thủy phân cellulose. Cellulose là chất xơ, giúp ruột hoạt động. Trâu bò tiêu hóa được cellulose nhờ vi sinh vật trong dạ dày."}, {"so": 4, "ten": "Sáng tạo", "nhiem_vu": "Một quảng cáo viết: \"Nước ngọt tăng lực, năng lượng tức thì, học xuyên đêm không mệt.\" Dùng kiến thức hôm nay, chỉ ra câu nào có cơ sở, câu nào chưa. Rồi viết lại một nhãn thật thà cho sản phẩm ấy, và thiết kế bữa tối ôn thi của chính em từ những món nhà em thường có.", "gv_danh_cho": "Học sinh giỏi, muốn thử thách mở. Không có gợi ý; nhiều đáp án đều được nếu có chứng cứ.", "gv_dap_an": "\"Năng lượng tức thì\" có cơ sở (glucose, saccharose vào máu nhanh). \"Học xuyên đêm không mệt\" chưa có chứng cứ trong bài. Nhãn thật thà nêu rõ thành phần đường, lượng dùng. Bữa tối tốt có đủ tinh bột, protein, rau, một ít chất béo."}], "noi_dung_phu": {"chu_de": "Ý chí tự do, quyền chọn về học, ăn thuận tự nhiên", "ten_buoc": "Em tự chọn", "loi_moi": "Không ai ăn hộ, học hộ được Minh. Biết về tinh bột, chất béo, protein rồi, chọn thế nào là việc của chính Minh, và của chính em.", "cau_hoi": ["Tuần này em tự chọn đổi một điều trong bữa ăn hoặc giờ học của mình. Đó là điều gì, và vì sao đó là lựa chọn của em chứ không phải vì ai bắt?", "Khi biết đường vào máu nhanh, người ta có thể dùng điều đó để giúp bạn học tỉnh táo, hoặc để bán được nhiều nước ngọt. Lương tâm em nói gì khi dùng một kiến thức?", "Với em, ăn thuận tự nhiên là thế nào: món ít qua chế biến, món theo mùa, ăn khi đói và dừng khi no, hay điều gì khác?"], "gv_y_do": "Không có đáp án đúng. Tôn trọng mọi lựa chọn, không phán xét bữa ăn của gia đình học sinh (hoàn cảnh mỗi nhà khác nhau). Học sinh có thể viết riêng, không cần chia sẻ trước lớp."}, "loi_chot": "Biết một chất có trong món gì, vào cơ thể ra sao, là có thêm quyền tự chọn. Em sẽ dùng quyền chọn ấy thế nào cho chính mình?", "gv_goi_y_lua_chon_d": "Ăn bữa tối đủ chất lúc 7 giờ, đến khuya đói thì ăn một quả chuối hoặc khoai luộc thay trà sữa; hoặc đổi giờ học sang sáng sớm.", "gv_hieu_lam": ["Càng ngọt càng tỉnh lâu", "Chất béo, tinh bột là xấu, nên bỏ hẳn", "Rau không có năng lượng nên ăn hay không cũng được", "Tinh bột và cellulose khác nhau hoàn toàn về thành phần"], "gv_ghi_chu": "Game mẫu theo yêu cầu của Cô Thúy, lớp 9, 4 level, nội dung phụ \"ý chí tự do, quyền chọn về học, ăn thuận tự nhiên\". Bản mẫu này soạn KHÔNG có ảnh trang sách, chỉ dùng kiến thức phổ thông chắc chắn; khi dùng thật Cô gửi ảnh các trang bài lipid, carbohydrate, protein để Trợ lý bám đúng sách. Thời lượng 25 phút vì có thêm bước Chọn level và Em tự chọn; cần gọn thì bỏ bước Phản biện. Bốn level: cả lớp cùng tình huống, mỗi bạn tự chọn level, đổi lúc nào cũng được; Level 1 gợi ý hiện sẵn, Level 2 và 3 bấm \"Xin gợi ý\", Level 4 không gợi ý. Không gọi tên level theo học lực trước lớp. Số kcal là số làm tròn phổ thông. Đây là tình huống học tập, không thay lời khuyên của bác sĩ hoặc chuyên gia dinh dưỡng. Nhóm D: phong cách tham khảo. Chẩn đoán: nếu cả lớp chọn ngay B, cho thảo luận lựa chọn C và Level 4.", "chau_ngoc": "an-lac", "du_an_that": "Tối nay ghi lại bữa tối của em và xếp các món vào bốn nhóm: tinh bột, protein, chất béo, chất xơ. Mai kể cho bạn ngồi cạnh một điều em tự chọn đổi.", "hinh_minh_hoa": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 240\"><rect width=\"600\" height=\"240\" fill=\"#FFF6D8\"/><rect y=\"176\" width=\"600\" height=\"64\" fill=\"#C98F55\"/><rect y=\"170\" width=\"600\" height=\"10\" fill=\"#B37A42\"/><rect x=\"430\" y=\"40\" width=\"130\" height=\"90\" rx=\"8\" fill=\"#DDF1FF\" stroke=\"#6aa8d6\" stroke-width=\"3\"/><circle cx=\"530\" cy=\"66\" r=\"14\" fill=\"#F7C52A\"/><path d=\"M430 130 L470 92 L500 118 L520 100 L560 130Z\" fill=\"#4CA51E\"/><g><ellipse cx=\"80\" cy=\"166\" rx=\"48\" ry=\"10\" fill=\"#e9e4d4\"/><path d=\"M36 140 Q80 196 124 140Z\" fill=\"#fff\" stroke=\"#9aa6b2\" stroke-width=\"3\"/><ellipse cx=\"80\" cy=\"140\" rx=\"44\" ry=\"12\" fill=\"#fffdf5\"/><circle cx=\"66\" cy=\"136\" r=\"4\" fill=\"#f4efe0\"/><circle cx=\"84\" cy=\"134\" r=\"4\" fill=\"#f4efe0\"/><circle cx=\"96\" cy=\"139\" r=\"4\" fill=\"#f4efe0\"/><\/g><g><ellipse cx=\"180\" cy=\"160\" rx=\"34\" ry=\"12\" fill=\"#fff\" stroke=\"#9aa6b2\" stroke-width=\"3\"/><ellipse cx=\"172\" cy=\"156\" rx=\"16\" ry=\"10\" fill=\"#fff\"/><circle cx=\"172\" cy=\"156\" r=\"6\" fill=\"#F7C52A\"/><rect x=\"190\" y=\"148\" width=\"18\" height=\"14\" rx=\"3\" fill=\"#f3ead2\" stroke=\"#d6c7a0\"/><\/g><g><ellipse cx=\"262\" cy=\"162\" rx=\"30\" ry=\"10\" fill=\"#fff\" stroke=\"#9aa6b2\" stroke-width=\"3\"/><path d=\"M240 156 Q250 128 262 154 Q270 126 284 156Z\" fill=\"#4CA51E\"/><path d=\"M250 158 Q262 138 274 158\" stroke=\"#2b5e17\" stroke-width=\"3\" fill=\"none\"/><\/g><g><rect x=\"318\" y=\"104\" width=\"30\" height=\"62\" rx=\"8\" fill=\"#FBE7A1\" stroke=\"#B8860B\" stroke-width=\"3\"/><rect x=\"326\" y=\"92\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#B8860B\"/><text x=\"333\" y=\
