<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game-học Vietwise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@500;700&display=swap">
<style>
:root{--blue:#0018F9;--cam:#F96726;--vang:#F9C12D;--bg:#FFFEF3;--card:#fff;--ink:#1b1b2b;--mut:#5b5b70;--line:#e6e2c8;--soft:#f4f1da;--xanh:#4E9F2E}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#8a95ff;--bg:#14141f;--card:#1e1e2d;--ink:#f2f1e6;--mut:#b0b0c4;--line:#35354a;--soft:#272738}}
:root[data-theme="dark"]{--blue:#8a95ff;--bg:#14141f;--card:#1e1e2d;--ink:#f2f1e6;--mut:#b0b0c4;--line:#35354a;--soft:#272738}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.6 Nunito,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3,.q{font-family:Quicksand,Nunito,sans-serif;font-weight:700}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:#fff;color:#444;font-size:14px;border-bottom:3px solid var(--cam)}
.brand.bot{border-bottom:0;border-top:3px solid var(--cam);margin-top:auto;justify-content:center;text-align:center;font:700 15px/1.5 Quicksand,sans-serif;color:#0018F9;padding:12px 16px}
.brand a{display:inline-flex;align-items:center}.brand img{height:var(--lh,44px);width:auto;display:block}
.brand .t{font-family:Quicksand,sans-serif;font-weight:700;color:#0018F9}@media(max-width:560px){.brand{--lh:30px;gap:4px 8px;padding:6px 12px;font-size:12px}.brand .t{font-size:12.5px}.brand .t:first-child{flex:0 0 100%}.brand.bot{font-size:13px}}
main{width:100%;max-width:980px;margin:0 auto;padding:18px 16px 28px;flex:1}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pill{background:var(--soft);border-radius:999px;padding:3px 14px;font:700 14px Quicksand;color:var(--mut)}
.bar{display:flex;gap:6px;margin:8px 0 16px}.bar i{flex:1;height:8px;border-radius:4px;background:var(--line)}.bar i.on{background:var(--cam)}.bar i.done{background:var(--xanh)}
h1{font-size:30px;color:var(--blue);margin:0 0 4px;line-height:1.2}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.panel h2{margin:0 0 10px;font-size:24px;color:var(--cam)}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:48px;height:48px;border-radius:50%;background:var(--vang);color:#222;display:grid;place-items:center;font:700 22px Quicksand}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tags span{background:var(--soft);border-radius:10px;padding:4px 12px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px}
.cd{min-height:130px;border-radius:16px;border:3px solid var(--blue);background:var(--blue);color:#fff;font:700 40px Quicksand;display:grid;place-items:center;cursor:pointer;padding:12px;text-align:center;transition:transform .2s}
.cd:hover{transform:translateY(-3px)}
.cd.open{background:var(--card);color:var(--ink);font:400 18px/1.5 Nunito;display:block;text-align:left;border-color:var(--cam);cursor:default}
.cd.open b{display:block;color:var(--cam);font:700 26px Quicksand}
.cd.open:hover{transform:none}
ul{padding-left:22px;margin:6px 0}li{margin:4px 0}
.dash{border:3px dashed var(--vang);border-radius:16px;padding:14px;margin-top:12px}
.g{background:#fff7d6;color:#3a3200;border-left:5px solid var(--vang);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:16px;display:none}
.gv .g{display:block}.g strong{font-weight:700}
.map{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px}
.map div{background:var(--soft);border-radius:10px;padding:8px 12px}
@media(max-width:640px){.map{grid-template-columns:1fr}h1{font-size:24px}}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{font:700 17px Quicksand;border-radius:999px;padding:10px 22px;cursor:pointer;border:2px solid var(--cam);background:var(--cam);color:#fff}
button.s{background:transparent;color:var(--ink);border-color:var(--blue)}
button:disabled{opacity:.4;cursor:default}
.tm{font:700 20px Quicksand;color:var(--mut);min-width:64px;text-align:center}
.ill{background:#fff;border-radius:14px;border:1px solid var(--line);margin:10px 0;overflow:hidden}.ill svg{width:100%;height:auto;max-height:260px;display:block}.mascot{width:96px;height:auto;float:right;margin:0 0 8px 12px}
.err{padding:24px;text-align:center;color:#DF0000;font-weight:700}
.say{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}.say button{min-height:44px;padding:8px 16px;border:2px solid #0018F9;background:#fff;border-radius:999px;font:700 16px Quicksand,sans-serif;color:#0018F9;cursor:pointer}.say small{flex:0 0 100%;color:#7a5a00}
#lock{position:fixed;inset:0;background:#fff;color:#222;z-index:99;display:none;place-items:center;text-align:center;padding:24px;font-size:20px}
</style></head><body>
<div id="lock"><div><b>Trang này đã bị gỡ hoặc sửa phần ghi nguồn Vietwise.</b><br>Thầy Cô vui lòng dùng bản gốc từ Skill Game-học tại <a href="https://vietwise.edu.vn" target="_blank" rel="noopener">Vietwise.edu.vn</a>.</div></div>

<main id="app"></main>

<script type="application/json" id="game">{"phien_ban": "1.0", "loai": "on-bai", "tieu_de": "Con số trên chai nước muối", "mon": "Khoa học tự nhiên", "lop": "8", "nhom_lop": "D", "nhom_mon": "khoa-hoc", "bai": "Mol, khối lượng mol, nồng độ phần trăm và nồng độ mol", "thoi_luong_phut": 15, "kien_thuc": ["n = m / M", "CM = n / V (V đổi ra lít)", "C% = m chất tan / m dung dịch × 100%"], "pham_chat": "trách nhiệm", "nhan_vat": [{"ten": "Lan"}], "loi_ke": "Em trai Lan hai tuổi bị nghẹt mũi. Mẹ đang bận nên nhờ Lan pha một lít nước muối rửa mũi giống loại bán ở hiệu thuốc. Trên chai ở hiệu thuốc ghi đúng một con số: NaCl 0,9%. Nhà Lan chỉ có muối ăn, một chiếc cân bếp và nước đun sôi để nguội. Lan đứng nhìn lọ muối và nghĩ: mặn hơn chắc sẽ sạch hơn, nhạt hơn thì chắc an toàn hơn. Nhưng vì sao nhà sản xuất lại không viết \"một nhúm muối\", mà phải viết một con số?", "du_kien": ["Pha 1 lít nước muối", "Nhãn: NaCl 0,9%", "Có cân bếp, muối ăn", "Người dùng: em bé 2 tuổi", "M của NaCl: 58,5 g/mol"], "lua_chon": [{"ma": "A", "noi_dung": "Cho thật nhiều muối, khoảng 30 g, vì mặn hơn thì sạch hơn", "gv_kien_thuc": "30 g NaCl = 0,51 mol trong 1 lít, gấp hơn 3 lần nồng độ trên nhãn (0,154 mol/L). Chưa có chứng cứ nào cho thấy mặn hơn thì sạch hơn."}, {"ma": "B", "noi_dung": "Đổi con số 0,9% trên nhãn ra số gam muối cần cân, rồi mới pha", "gv_kien_thuc": "0,9% nghĩa là 0,9 g trong 100 ml, tức 9 g trong 1 lít; n = 9 : 58,5 ≈ 0,154 mol, CM ≈ 0,154 M. Dùng được kiến thức mol và nồng độ để pha đúng."}, {"ma": "C", "noi_dung": "Cho vài hạt muối thôi, khoảng 1 g, cho chắc là an toàn", "gv_kien_thuc": "1 g NaCl = 0,017 mol trong 1 lít, nhạt hơn nhãn khoảng 9 lần. Nhạt quá thì không còn là loại dung dịch như trên nhãn."}], "cach_chon": "Giơ thẻ màu A, B hoặc C", "cau_hoi_goi_mo": ["Lan cần biết những số liệu nào để biết phải cân bao nhiêu gam muối?", "Vì sao chai thuốc ghi một con số mà không ghi \"một nhúm\"?", "Cùng một chai, ghi 0,9% và ghi 0,154 mol/L có nói về cùng một dung dịch không?"], "cau_mau_phan_bien": ["Nếu Lan pha 2 lít thì số mol muối và số gam muối đổi thế nào?", "Nếu nhà không có cân mà chỉ có cốc đong, em dựa vào đâu để pha?", "Bạn đã kiểm tra lại phép tính bằng cách khác chưa?"], "so_do_chot": [{"kien_thuc": "n = m / M", "dung_vao": "Đổi 9 g NaCl ra khoảng 0,154 mol"}, {"kien_thuc": "CM = n / V", "dung_vao": "1 lít dung dịch có CM khoảng 0,154 M"}, {"kien_thuc": "C% = m chất tan / m dung dịch × 100%", "dung_vao": "Đọc hiểu con số 0,9% trên nhãn"}], "loi_chot": "Khi tự pha thứ gì đó cho người thân dùng, tin vào con số hay tin vào cảm giác \"mặn vừa\"? Thế nào là có trách nhiệm với con số?", "gv_goi_y_lua_chon_d": "Dùng nước muối sinh lý đóng sẵn hoặc hỏi mẹ, dược sĩ trước; Lan có thể giải thích cho mẹ vì sao con số 0,9% quan trọng.", "gv_hieu_lam": ["Mặn hơn thì sạch hơn", "Mol chỉ là con số trên giấy, không dùng được ngoài đời", "Quên đổi ml ra lít khi tính CM"], "gv_ghi_chu": "Đáp số: 0,9% tương đương 9 g NaCl trong 1 lít dung dịch, khoảng 0,154 mol/L. 30 g ≈ 0,51 mol/L; 1 g ≈ 0,017 mol/L. Đây là phép tính xấp xỉ cho tình huống học tập, không thay lời khuyên của bác sĩ hoặc dược sĩ về việc dùng nước muối cho trẻ. Ý nghĩa của mol để gợi hiếu kỳ: mol cho biết số hạt, nên cân bằng gam mà vẫn biết số hạt trong dung dịch. Số liệu các câu a–h trong trang học sinh: a 3 mol; c 37,185 lít; d 1,25 mol; e 55,5 g; f 106,5 g; g 22%; thể tích mol ở đkc 24,79 lít.", "chau_ngoc": "hieu-ky", "du_an_that": "Về nhà, tìm một nhãn có ghi nồng độ (gói oresol, chai nước muối, nước rửa tay), đọc con số và kể cho lớp nghe con số ấy giúp người dùng điều gì.", "hinh_minh_hoa": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 240\"><rect width=\"600\" height=\"240\" fill=\"#FFF6D8\"/><rect y=\"190\" width=\"600\" height=\"50\" fill=\"#E8C98A\"/><rect y=\"186\" width=\"600\" height=\"8\" fill=\"#D9B46C\"/><g><rect x=\"40\" y=\"150\" width=\"130\" height=\"40\" rx=\"10\" fill=\"#4E9F2E\"/><rect x=\"62\" y=\"158\" width=\"86\" height=\"22\" rx=\"5\"
