<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trình chơi game lớp học</title>
<style>
  :root {
    --nen: #f6f4ef; --mat: #ffffff; --chu: #1f2430; --chu-nhat: #5b6170; --vien: #d9d5cc;
    --nhan: #2f4b8f; --nhan-nhat: #e3e9f7; --canh-bao: #b5501d; --gv: #7a3db8;
    --the-a: #2f6fd1; --the-b: #d1832f; --the-c: #2f9e6a; --the-d: #8a5cc9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--nen); color: var(--chu); font-family: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--vien); background: var(--mat); color: var(--chu); border-radius: 10px; padding: 8px 14px; }
  button:hover { border-color: var(--nhan); }
  button.chinh { background: var(--nhan); border-color: var(--nhan); color: #fff; }
  .an { display: none !important; }

  /* Màn hình nạp game */
  #nap { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
  #nap h1 { font-size: 28px; margin: 0 0 8px; }
  #nap p { color: var(--chu-nhat); line-height: 1.5; }
  #nap textarea { width: 100%; min-height: 260px; font: 14px/1.4 ui-monospace, Consolas, monospace; padding: 12px; border: 1px solid var(--vien); border-radius: 10px; background: var(--mat); color: var(--chu); }
  #nap .hang { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #loi { color: var(--canh-bao); white-space: pre-line; margin-top: 12px; }

  /* Màn hình chơi */
  #choi { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
  #dau { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--mat); border-bottom: 1px solid var(--vien); flex-wrap: wrap; }
  #ten-game { font-weight: 700; font-size: 20px; }
  #mo-ta { color: var(--chu-nhat); font-size: 15px; }
  #cac-buoc { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  #cac-buoc button { padding: 6px 10px; font-size: 14px; border-radius: 999px; }
  #cac-buoc button.dang { background: var(--nhan); color: #fff; border-color: var(--nhan); }
  #cac-buoc button.xong { background: var(--nhan-nhat); }
  .gio { display: flex; align-items: center; gap: 8px; }
  #dong-ho { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 700; min-width: 92px; text-align: right; }
  #dong-ho.het { color: var(--canh-bao); animation: nhay 1s steps(2) infinite; }
  @keyframes nhay { 50% { opacity: .35; } }

  #san { position: relative; overflow: auto; padding: 28px 40px; }
  #cuoi { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--mat); border-top: 1px solid var(--vien); }
  #cuoi .giua { flex: 1; color: var(--chu-nhat); font-size: 14px; text-align: center; }

  .ten-buoc { font-size: clamp(26px, 3vw, 40px); font-weight: 800; margin: 0 0 6px; }
  .huong-dan { font-size: clamp(18px, 1.8vw, 24px); color: var(--chu-nhat); margin: 0 0 24px; }
  .chu-lon { font-size: clamp(24px, 2.8vw, 40px); line-height: 1.45; }
  .hop { background: var(--mat); border: 1px solid var(--vien); border-radius: 16px; padding: 24px 28px; }

  /* Bước kể */
  .canh { position: relative; min-height: 64vh; border-radius: 18px; overflow: hidden; background: #3b4a5c center / cover no-repeat; display: flex; align-items: flex-end; }
  .canh::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.55) 55%); }
  .nhan-vat { position: relative; z-index: 1; display: flex; gap: 12px; padding: 0 24px; align-self: flex-end; }
  .nhan-vat figure { margin: 0; text-align: center; color: #fff; font-weight: 700; font-size: 20px; }
  .nhan-vat img { height: 42vh; max-height: 420px; display: block; }
  .loi-ke { position: relative; z-index: 1; margin: 24px 24px 24px auto; max-width: 60%; background: rgba(255,255,255,.95); color: var(--chu); border-radius: 16px; padding: 24px 28px; }
  .du-kien { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .du-kien span { background: var(--nhan-nhat); color: var(--nhan); border-radius: 999px; padding: 6px 14px; font-size: clamp(16px, 1.5vw, 22px); font-weight: 600; }

  /* Thẻ lựa chọn */
  .bo-the { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
  .the { perspective: 1200px; min-height: 340px; border: 0; padding: 0; background: none; }
  .the .trong { position: relative; width: 100%; height: 100%; min-height: 340px; transition: transform .6s; transform-style: preserve-3d; }
  .the.lat .trong { transform: rotateY(180deg); }
  .mat-sau, .mat-truoc { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .mat-sau { background: var(--nhan) center / cover no-repeat; color: #fff; font-size: 72px; font-weight: 800; }
  .mat-truoc { transform: rotateY(180deg); color: #fff; text-align: center; }
  .mat-truoc .ma { font-size: 64px; font-weight: 800; line-height: 1; margin-bottom: 14px; }
  .mat-truoc .nd { font-size: clamp(20px, 2vw, 28px); line-height: 1.35; font-weight: 600; }
  .the[data-ma="A"] .mat-truoc { background: var(--the-a); }
  .the[data-ma="B"] .mat-truoc { background: var(--the-b); }
  .the[data-ma="C"] .mat-truoc { background: var(--the-c); }
  .the[data-ma="D"] .mat-truoc { background: var(--the-d); }

  .ds-chon { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; font-size: clamp(18px, 1.8vw, 24px); }
  .ds-chon b { display: inline-block; min-width: 1.6em; }
  ol.cau-hoi { margin: 0; padding-left: 1.2em; }
  ol.cau-hoi li { margin: 0 0 14px; }
  .khung { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
  .khung .hop h3 { margin: 0 0 8px; font-size: 24px; color: var(--nhan); }
  .khung .hop p { margin: 0; font-size: 20px; color: var(--chu-nhat); }
  .bang-goc { border: 4px dashed var(--nhan); border-radius: 18px; padding: 32px; background: var(--mat); }
  .bang-goc .nhan { font-size: 18px; font-weight: 700; color: var(--nhan); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .so-do { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px 16px; align-items: center; font-size: clamp(18px, 1.8vw, 24px); }
  .so-do .kt { background: var(--nhan-nhat); border-radius: 12px; padding: 12px 16px; font-weight: 600; }
  .so-do .mui { color: var(--chu-nhat); font-size: 28px; }
  .so-do .dv { border: 1px solid var(--vien); border-radius: 12px; padding: 12px 16px; background: var(--mat); }
  .pham-chat { margin-top: 28px; font-size: clamp(20px, 2vw, 28px); font-style: italic; }
  .an-di { filter: blur(14px); cursor: pointer; transition: filter .3s; }

  /* Chế độ giáo viên */
  #gv { position: fixed; top: 0; right: 0; width: min(420px, 92vw); height: 100vh; overflow: auto; background: #fbf8ff; border-left: 4px solid var(--gv); padding: 18px 20px; box-shadow: -8px 0 24px rgba(0,0,0,.12); z-index: 10; }
  #gv h2 { color: var(--gv); margin: 0 0 4px; font-size: 20px; }
  #gv .canh-bao { color: var(--gv); font-size: 13px; margin: 0 0 14px; }
  #gv h3 { font-size: 15px; margin: 16px 0 6px; }
  #gv p, #gv li { font-size: 15px; line-height: 1.45; margin: 0 0 6px; }

  @media (max-width: 760px) {
    #san { padding: 16px; }
    .loi-ke { max-width: none; margin: 16px; }
    .nhan-vat { display: none; }
    .khung { grid-template-columns: 1fr; }
    .so-do { grid-template-columns: 1fr; }
    .so-do .mui { display: none; }
    #cuoi .giua { visibility: hidden; font-size: 0; }
    .the, .the .trong { min-height: 200px; }
  }
</style>
</head>
<body>

<section id="nap" class="an">
  <h1>Mở game lớp học</h1>
  <p>Dán đoạn JSON Claude đã tạo vào ô dưới đây rồi bấm <b>Mở game</b>. Hoặc mở thử một game mẫu.</p>
  <textarea id="o-dan" spellcheck="false" placeholder='{ "phien_ban": "1.0", "loai": "mo-tiet", ... }'></textarea>
  <div class="hang">
    <button class="chinh" id="nut-mo">Mở game</button>
    <button data-mau="../examples/mo-tiet-toan5-ti-so-phan-tram.json">Mẫu Game 1: mở tiết</button>
    <button data-mau="../examples/on-bai-khoahoc4-nuoc.json">Mẫu Game 2: ôn bài</button>
  </div>
  <div id="loi"></div>
</section>

<section id="choi" class="an">
  <header id="dau">
    <div>
      <div id="ten-game"></div>
      <div id="mo-ta"></div>
    </div>
    <nav id="cac-buoc"></nav>
    <div class="gio">
      <div id="dong-ho">0:00</div>
      <button id="nut-gio" title="Bắt đầu hoặc dừng đồng hồ (phím cách)">▶</button>
      <button id="nut-dat-lai" title="Đặt lại đồng hồ">↺</button>
    </div>
  </header>
  <main id="san"></main>
  <footer id="cuoi">
    <button id="nut-truoc">‹ Trước</button>
    <div class="giua">← → chuyển bước · Cách: đồng hồ · G: chế độ giáo viên · F: toàn màn hình</div>
    <button id="nut-gv">Giáo viên</button>
    <button class="chinh" id="nut-tiep">Tiếp ›</button>
  </footer>
</section>

<aside id="gv" class="an"></aside>

<script>
(() => {
  'use strict';

  // ---------- Tiện ích ----------
  const $ = id => document.getElementById(id);
  const h = (tag, attrs, ...con) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v);
    }
    for (const c of con.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
    return el;
  };
  const thamSo = new URLSearchParams(location.search);

  // ---------- Nhịp các bước (phút) ----------
  const NHIP = {
    'mo-tiet': [
      { id: 'ke', ten: 'Kể', phut: 1 },
      { id: 'chon', ten: 'Chọn', phut: 2 },
      { id: 'ly-do', ten: 'Nói lý do', phut: 3 },
      { id: 'buoc-ngoat', ten: 'Bước ngoặt', phut: 2 },
      { id: 'treo', ten: 'Câu hỏi của hôm nay', phut: 2 }
    ],
    'on-bai': [
      { id: 'ke', ten: 'Kể', phut: 1 },
      { id: 'chon', ten: 'Chọn', phut: 2 },
      { id: 'chung-cu', ten: 'Chứng cứ', phut: 4 },
      { id: 'phan-bien', ten: 'Phản biện', phut: 4 },
      { id: 'sang-tao', ten: 'Sáng tạo', phut: 2 },
      { id: 'chot', ten: 'Chốt kiến thức', phut: 2 }
    ]
  };

  // ---------- Kiểm tra nội dung ----------
  function kiemTra(g) {
    const loi = [];
    if (!g || typeof g !== 'object' || Array.isArray(g)) return ['Nội dung không phải một đối tượng JSON.'];
    const batBuoc = ['loai', 'tieu_de', 'mon', 'lop', 'bai', 'pham_chat', 'loi_ke', 'lua_chon'];
    if (g.loai === 'mo-tiet') batBuoc.push('buoc_ngoat', 'cau_hoi_treo');
    if (g.loai === 'on-bai') batBuoc.push('kien_thuc', 'so_do_chot');
    for (const k of batBuoc) if (g[k] == null || g[k] === '') loi.push(`Thiếu trường "${k}".`);
    if (g.loai && !NHIP[g.loai]) loi.push(`"loai" phải là "mo-tiet" hoặc "on-bai", đang là "${g.loai}".`);
    if (g.lua_chon && (!Array.isArray(g.lua_chon) || g.lua_chon.length < 2 || g.lua_chon.length > 3)) loi.push('"lua_chon" phải có 2 hoặc 3 lựa chọn.');
    if (Array.isArray(g.lua_chon)) g.lua_chon.forEach((c, i) => { if (!c || !c.ma || !c.noi_dung) loi.push(`Lựa chọn thứ ${i + 1} thiếu "ma" hoặc "noi_dung".`); });
    return loi;
  }

  // ---------- Ảnh từ manifest ----------
  const goc = new URL(thamSo.get('assets') || '../assets/', location.href);
  let anh = {};
  const thieuAnh = new Set();
  async function napManifest() {
    try {
      const r = await fetch(new URL('manifest.json', goc));
      if (!r.ok) throw new Error(r.status);
      const m = await r.json();
      for (const a of m.anh || []) anh[a.id] = new URL(a.tep, goc).href;
    } catch (e) {
      console.warn('Không tải được manifest ảnh, game chạy không có ảnh.', e);
    }
  }
  const duongAnh = id => {
    if (!id) return null;
    if (anh[id]) return anh[id];
    thieuAnh.add(id);
    return null;
  };

  // ---------- Trạng thái ----------
  let game = null, buoc = [], so = 0, conLai = 0, chay = false, hen = null;
  const daLat = new Set();

  function batDau(g) {
    game = g;
    const nhip = NHIP[g.loai].map(b => ({ ...b }));
    const tong = nhip.reduce((s, b) => s + b.phut, 0);
    if (g.thoi_luong_phut && g.thoi_luong_phut !== tong) {
      const k = g.thoi_luong_phut / tong;
      nhip.forEach(b => { b.phut = Math.max(0.5, Math.round(b.phut * k * 2) / 2); });
    }
    buoc = nhip;
    so = 0;
    daLat.clear();
    $('nap').classList.add('an');
    $('choi').classList.remove('an');
    $('ten-game').textContent = g.tieu_de;
    $('mo-ta').textContent = `${g.mon} ${g.lop} · ${g.bai} · ${buoc.reduce((s, b) => s + b.phut, 0)} phút · ${g.loai === 'mo-tiet' ? 'Game mở tiết' : 'Game ôn bài'}`;
    document.title = g.tieu_de;
    veGiaoVien();
    sangBuoc(0);
  }

  // ---------- Đồng hồ ----------
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.max(0, s) % 60).padStart(2, '0')}`;
  function veGio() {
    $('dong-ho').textContent = fmt(conLai);
    $('dong-ho').classList.toggle('het', conLai <= 0);
    $('nut-gio').textContent = chay ? '⏸' : '▶';
  }
  function datGio() { dungGio(); conLai = Math.round(buoc[so].phut * 60); veGio(); }
  function chayGio() {
    if (chay) return;
    chay = true;
    hen = setInterval(() => { conLai -= 1; if (conLai <= 0) { conLai = 0; dungGio(); } veGio(); }, 1000);
    veGio();
  }
  function dungGio() { chay = false; clearInterval(hen); veGio(); }

  // ---------- Chuyển bước ----------
  function sangBuoc(i) {
    so = Math.max(0, Math.min(buoc.length - 1, i));
    const nav = $('cac-buoc');
    nav.replaceChildren(...buoc.map((b, j) => h('button', { class: j === so ? 'dang' : j < so ? 'xong' : '', onclick: () => sangBuoc(j) }, `${j + 1}. ${b.ten}`)));
    $('nut-truoc').disabled = so === 0;
    $('nut-tiep').textContent = so < buoc.length - 1 ? 'Tiếp ›' : game.loai === 'mo-tiet' ? 'Vào bài ›' : 'Kết thúc ›';
    datGio();
    const san = $('san');
    san.replaceChildren(VE[buoc[so].id]());
    san.scrollTop = 0;
  }

  // ---------- Vẽ từng bước ----------
  const tieuDe = (ten, hd) => [h('h2', { class: 'ten-buoc' }, ten), hd ? h('p', { class: 'huong-dan' }, hd) : null];

  function boThe({ lat = false, coD = false } = {}) {
    const lung = duongAnh('lung-the');
    const the = (ma, noiDung) => {
      const el = h('button', { class: 'the' + (lat || daLat.has(ma) ? ' lat' : ''), 'data-ma': ma, 'aria-label': `Thẻ ${ma}` },
        h('div', { class: 'trong' },
          h('div', { class: 'mat-sau', style: lung ? `background-image:url("${lung}")` : '' }, lung ? '' : '?'),
          h('div', { class: 'mat-truoc' }, h('div', { class: 'ma' }, ma), h('div', { class: 'nd' }, noiDung))));
      el.addEventListener('click', () => { el.classList.toggle('lat'); el.classList.contains('lat') ? daLat.add(ma) : daLat.delete(ma); });
      return el;
    };
    const ds = game.lua_chon.map(c => the(c.ma, c.noi_dung));
    if (coD) ds.push(the('D', 'Lựa chọn của lớp mình'));
    return h('div', { class: 'bo-the' }, ds);
  }

  const VE = {
    'ke': () => {
      const nen = duongAnh(game.boi_canh);
      return h('div', {},
        h('div', { class: 'canh', style: nen ? `background-image:url("${nen}")` : '' },
          h('div', { class: 'nhan-vat' }, (game.nhan_vat || []).map(n => {
            const s = duongAnh(n.sprite);
            return h('figure', {}, s ? h('img', { src: s, alt: n.ten }) : null, h('figcaption', {}, n.ten));
          })),
          h('div', { class: 'loi-ke' },
            h('div', { class: 'chu-lon' }, game.loi_ke),
            game.du_kien && game.du_kien.length ? h('div', { class: 'du-kien' }, game.du_kien.map(d => h('span', {}, d))) : null)));
    },
    'chon': () => h('div', {},
      tieuDe('Em sẽ chọn gì?', `${game.cach_chon || 'Mọi em chọn cùng lúc'}. Im lặng, chọn một mình, chưa bàn với bạn. Bấm vào thẻ để lật.`),
      boThe()),
    'ly-do': () => h('div', {},
      tieuDe('Vì sao em chọn vậy?', 'Không có đúng hay sai. Được đổi ý bất cứ lúc nào.'),
      h('div', { class: 'hop' }, h('ol', { class: 'cau-hoi chu-lon' },
        (game.cau_hoi_goi_mo && game.cau_hoi_goi_mo.length ? game.cau_hoi_goi_mo : ['Vì sao em nghĩ vậy?', 'Ai có lý do khác?', 'Nếu là em, điều gì làm em lo nhất?']).map(c => h('li', {}, c))))),
    'buoc-ngoat': () => {
      const an = h('div', { class: 'hop chu-lon an-di', title: 'Bấm để hiện' }, game.buoc_ngoat);
      an.addEventListener('click', () => an.classList.remove('an-di'));
      return h('div', {}, tieuDe('Nhưng nếu…', 'Có thêm một chi tiết mới. Em có muốn chọn lại không?'), an, h('div', { style: 'margin-top:24px' }, boThe({ lat: true })));
    },
    'treo': () => h('div', {},
      tieuDe('Câu hỏi của hôm nay', 'Ghi vào vở. Cuối giờ mình quay lại.'),
      h('div', { class: 'bang-goc' }, h('div', { class: 'nhan' }, 'Câu hỏi của hôm nay'), h('div', { class: 'chu-lon', style: 'font-weight:700' }, game.cau_hoi_treo)),
      game.loi_chot ? h('p', { class: 'pham-chat' }, game.loi_chot) : null),
    'chung-cu': () => h('div', {},
      tieuDe('Chứng cứ của em là gì?', 'Làm theo cặp, điền thẻ lập luận. Được mở vở và SGK.'),
      h('div', { class: 'khung' },
        h('div', { class: 'hop' }, h('h3', {}, 'Chọn'), h('p', {}, 'Em/nhóm chọn A, B hay C?')),
        h('div', { class: 'hop' }, h('h3', {}, 'Chứng cứ'), h('p', {}, 'Kiến thức nào trong bài? Ghi rõ bài nào, ý nào.')),
        h('div', { class: 'hop' }, h('h3', {}, 'Lập luận'), h('p', {}, 'Vì sao chứng cứ đó dẫn tới lựa chọn của em?'))),
      game.cau_hoi_goi_mo && game.cau_hoi_goi_mo.length ? h('div', { class: 'hop', style: 'margin-top:20px' }, h('ol', { class: 'cau-hoi', style: 'font-size:22px' }, game.cau_hoi_goi_mo.map(c => h('li', {}, c)))) : null,
      h('div', { class: 'hop ds-chon' }, game.lua_chon.map(c => h('div', {}, h('b', {}, c.ma + '.'), ' ', c.noi_dung)))),
    'phan-bien': () => h('div', {},
      tieuDe('Phản biện', 'Hỏi vào lập luận, không hỏi vào người.'),
      h('div', { class: 'hop' }, h('ol', { class: 'cau-hoi chu-lon' },
        [...(game.cau_mau_phan_bien || []), 'Chứng cứ của bạn lấy từ đâu trong bài?', 'Mình đồng ý phần…, nhưng chưa đồng ý phần… vì…']
          .slice(0, 5).map(c => h('li', {}, c))))),
    'sang-tao': () => h('div', {},
      tieuDe('Có lựa chọn D nào tốt hơn không?', 'Đề xuất của lớp mình, giải thích bằng kiến thức đã học.'),
      boThe({ lat: true, coD: true })),
    'chot': () => h('div', {},
      tieuDe('Kiến thức mình đã dùng', 'Ghi sơ đồ vào vở.'),
      h('div', { class: 'so-do' }, (game.so_do_chot || []).flatMap(s => [h('div', { class: 'kt' }, s.kien_thuc), h('div', { class: 'mui' }, '→'), h('div', { class: 'dv' }, s.dung_vao)])),
      game.loi_chot ? h('p', { class: 'pham-chat' }, game.loi_chot) : null)
  };

  // ---------- Chế độ giáo viên ----------
  function veGiaoVien() {
    const g = game, phan = [];
    phan.push(h('h2', {}, 'Chế độ giáo viên'), h('p', { class: 'canh-bao' }, 'Đừng chiếu phần này cho học sinh. Bấm G để ẩn.'));
    if (g.kien_thuc && g.kien_thuc.length) phan.push(h('h3', {}, g.loai === 'mo-tiet' ? 'Kiến thức sẽ mở' : 'Kiến thức được ôn'), h('ul', {}, g.kien_thuc.map(k => h('li', {}, k))));
    phan.push(h('h3', {}, 'Phẩm chất đi kèm'), h('p', {}, g.pham_chat));
    phan.push(h('h3', {}, 'Các lựa chọn'), h('ul', {}, g.lua_chon.map(c => h('li', {}, h('b', {}, `${c.ma}. `), c.noi_dung,
      c.gv_cai_gia ? h('div', {}, h('i', {}, 'Cái giá: '), c.gv_cai_gia) : null,
      c.gv_kien_thuc ? h('div', {}, h('i', {}, 'Kiến thức: '), c.gv_kien_thuc) : null))));
    if (g.buoc_ngoat && g.loai === 'on-bai') phan.push(h('h3', {}, 'Bước ngoặt (bản mở rộng)'), h('p', {}, g.buoc_ngoat));
    if (g.gv_goi_y_lua_chon_d) phan.push(h('h3', {}, 'Gợi ý lựa chọn D'), h('p', {}, g.gv_goi_y_lua_chon_d));
    if (g.gv_hieu_lam && g.gv_hieu_lam.length) phan.push(h('h3', {}, 'Hiểu lầm cần sửa khi chốt'), h('ul', {}, g.gv_hieu_lam.map(x => h('li', {}, x))));
    if (g.quay_lai_cuoi_tiet) phan.push(h('h3', {}, 'Quay lại cuối tiết'), h('p', {}, g.quay_lai_cuoi_tiet));
    if (g.gv_ghi_chu) phan.push(h('h3', {}, 'Ghi chú'), h('p', {}, g.gv_ghi_chu));
    if (thieuAnh.size) phan.push(h('h3', {}, 'Ảnh không tìm thấy trong manifest'), h('p', {}, [...thieuAnh].join(', ')));
    $('gv').replaceChildren(...phan);
  }
  const batTatGV = () => { veGiaoVien(); $('gv').classList.toggle('an'); };

  // ---------- Nạp game ----------
  function moTuChuoi(s) {
    let g;
    try { g = JSON.parse(s.trim().replace(/^```(?:json)?\s*|\s*```$/g, '')); }
    catch (e) { hienNap(); $('loi').textContent = 'Không đọc được JSON: ' + e.message + '\nHãy sao chép lại nguyên khối JSON từ Claude.'; return; }
    const loi = kiemTra(g);
    if (loi.length) { hienNap(); $('loi').textContent = 'Nội dung game còn thiếu:\n• ' + loi.join('\n• ') + '\nHãy nhờ Claude sửa lại theo đúng khung.'; return; }
    try { localStorage.setItem('game-gan-nhat', JSON.stringify(g)); } catch (e) {}
    batDau(g);
  }
  async function moTuUrl(u) {
    try {
      const r = await fetch(new URL(u, location.href));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      moTuChuoi(await r.text());
    } catch (e) {
      hienNap();
      $('loi').textContent = 'Không tải được game từ ' + u + ': ' + e.message;
    }
  }
  function hienNap() {
    $('choi').classList.add('an');
    $('nap').classList.remove('an');
    try { const cu = localStorage.getItem('game-gan-nhat'); if (cu && !$('o-dan').value) $('o-dan').value = JSON.stringify(JSON.parse(cu), null, 2); } catch (e) {}
  }

  // ---------- Sự kiện ----------
  $('nut-mo').addEventListener('click', () => moTuChuoi($('o-dan').value));
  document.querySelectorAll('[data-mau]').forEach(b => b.addEventListener('click', () => moTuUrl(b.dataset.mau)));
  $('nut-truoc').addEventListener('click', () => sangBuoc(so - 1));
  $('nut-tiep').addEventListener('click', () => { if (so < buoc.length - 1) sangBuoc(so + 1); else { dungGio(); hienNap(); } });
  $('nut-gio').addEventListener('click', () => chay ? dungGio() : chayGio());
  $('nut-dat-lai').addEventListener('click', datGio);
  $('nut-gv').addEventListener('click', batTatGV);
  document.addEventListener('keydown', e => {
    if (!game || $('choi').classList.contains('an') || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') sangBuoc(so + 1);
    else if (e.key === 'ArrowLeft') sangBuoc(so - 1);
    else if (e.key === ' ') { e.preventDefault(); chay ? dungGio() : chayGio(); }
    else if (e.key === 'g' || e.key === 'G') batTatGV();
    else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  });

  // ---------- Khởi động ----------
  napManifest().then(() => {
    const spec = thamSo.get('spec');
    if (spec) moTuUrl(spec); else hienNap();
  });
})();
</script>
</body>
</html>
